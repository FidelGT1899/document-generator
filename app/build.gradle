/*
 * Build configuration for the Swing desktop application.
 * Swing is part of the JDK, so no external dependencies are required for the UI.
 */

plugins {
    id 'application'
    id 'base'
    alias(libs.plugins.jpackage)
}

version = '1.0.0'

base {
    archivesName = 'GeneradorDeDocumentos'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Apache POI for generating .docx documents. Kept isolated in the infrastructure layer.
    implementation libs.poi.ooxml

    // Jackson for JSON draft persistence. Kept isolated in the infrastructure layer.
    implementation libs.jackson.databind
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Main class that boots the Swing UI.
    mainClass = 'com.fidelg.documentgenerator.App'
}

tasks.withType(JavaCompile).configureEach {
    // Ensure UTF-8 encoding across platforms for UI strings.
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// Snapshot aplication jar + all runtime dependencies as input for jpackage.
def jpackageInputDir = layout.buildDirectory.dir('jpackage-input')

tasks.register('prepareJpackageInput', Sync) {
    dependsOn jar
    into jpackageInputDir
    from jar
    from configurations.runtimeClasspath
}

// Minimal runtime image computed with jdeps for this app (Swing + POI).
// jpackage does not trim its runtime for non-modular apps, so we build it with jlink
// and pass it via --runtime-image.
def runtimeModules = 'java.base,java.desktop,java.logging,java.security.jgss,java.xml.crypto'
def jlinkOutput = layout.buildDirectory.dir('jlink-runtime').get().asFile
def jlinkExecutable = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}.get().metadata.installationPath.asFile.path + '/bin/jlink'

tasks.register('cleanJlinkRuntime', Delete) {
    delete jlinkOutput
}

tasks.register('createRuntimeImage', Exec) {
    dependsOn tasks.named('cleanJlinkRuntime')
    commandLine jlinkExecutable,
            '--add-modules', runtimeModules,
            '--strip-debug',
            '--no-header-files',
            '--no-man-pages',
            '--compress', 'zip-6',
            '--output', jlinkOutput.path
}

tasks.named('jpackage') {
    dependsOn tasks.named('prepareJpackageInput')
    dependsOn tasks.named('createRuntimeImage')

    input = jpackageInputDir
    destination = layout.buildDirectory.dir('jpackage')
    runtimeImage = layout.buildDirectory.dir('jlink-runtime')

    appName = 'GeneradorDeDocumentos'
    appDescription = 'Generador de documentos Word de escritorio'
    mainJar = jar.archiveFileName
    mainClass = 'com.fidelg.documentgenerator.App'
    type = org.panteleyev.jpackage.ImageType.APP_IMAGE
}

tasks.register('packageWindows') {
    group = 'distribution'
    description = 'Genera el app-image portable con jpackage (Windows con JDK Windows; en WSL produce un app-image Linux).'
    dependsOn tasks.named('jpackage')
}
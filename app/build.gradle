/*
 * Build configuration for the Swing desktop application.
 * Swing is part of the JDK, so no external dependencies are required for the UI.
 */

plugins {
    // Apply the application plugin to build and run the Swing desktop app.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Apache POI for generating .docx documents. Kept isolated in the infrastructure layer.
    implementation libs.poi.ooxml
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Main class that boots the Swing UI.
    mainClass = 'com.fidelg.documentgenerator.App'
}

tasks.withType(JavaCompile).configureEach {
    // Ensure UTF-8 encoding across platforms for UI strings.
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}